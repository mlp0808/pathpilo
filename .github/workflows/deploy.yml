name: Deploy PathPilo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: Production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api-server/package-lock.json
            marketing/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Marketing Dependencies
        run: cd marketing && npm ci

      - name: Write .env for Build
        run: |
          printf '%s\n' \
            "NEXT_PUBLIC_MAPBOX_TOKEN=${{ vars.NEXT_PUBLIC_MAPBOX_TOKEN }}" \
            "NEXT_PUBLIC_HOTJAR_ID=${{ vars.NEXT_PUBLIC_HOTJAR_ID }}" \
            "NEXT_PUBLIC_HOTJAR_SV=${{ vars.NEXT_PUBLIC_HOTJAR_SV }}" \
            "NEXT_PUBLIC_CRISP_WEBSITE_ID=${{ vars.NEXT_PUBLIC_CRISP_WEBSITE_ID }}" \
            "NEXT_PUBLIC_API_URL=" > .env
          # Marketing is a separate Next.js app — it only reads env from marketing/
          # NEXT_PUBLIC_* vars are inlined at build time, so Mapbox MUST be here
          # or /tools/route-planner ships with a blank map.
          printf '%s\n' \
            "NEXT_PUBLIC_MAPBOX_TOKEN=${{ vars.NEXT_PUBLIC_MAPBOX_TOKEN }}" \
            "NEXT_PUBLIC_HOTJAR_ID=${{ vars.NEXT_PUBLIC_HOTJAR_ID }}" \
            "NEXT_PUBLIC_HOTJAR_SV=${{ vars.NEXT_PUBLIC_HOTJAR_SV }}" \
            "NEXT_PUBLIC_CRISP_WEBSITE_ID=${{ vars.NEXT_PUBLIC_CRISP_WEBSITE_ID }}" > marketing/.env
          if [ -z "${{ vars.NEXT_PUBLIC_MAPBOX_TOKEN }}" ]; then
            echo "::warning::NEXT_PUBLIC_MAPBOX_TOKEN is empty in GitHub Actions Variables — the marketing route planner map will be blank. Add it under Settings → Secrets and variables → Actions → Variables."
          fi
          if [ -z "${{ vars.NEXT_PUBLIC_CRISP_WEBSITE_ID }}" ]; then
            echo "::warning::NEXT_PUBLIC_CRISP_WEBSITE_ID is empty in GitHub Actions Variables — Crisp will NOT be in the production build. Add it under Settings → Secrets and variables → Actions → Variables (Production environment)."
          fi

      - name: Build Frontend
        run: npm run build

      - name: Build Marketing
        run: cd marketing && npm run build

      - name: Create Deployment Archive
        shell: bash
        run: |
          set +e
          tar -czf deployment.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.github \
            --exclude=.env \
            --exclude=logs \
            --exclude=PathPiloMobile \
            --exclude=pathpilo_web_OLD_DO_NOT_USE \
            --exclude='marketing/node_modules' \
            --exclude='api-server/node_modules' \
            --exclude='api-server/.env' \
            .
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 0 ] || [ $EXIT_CODE -eq 1 ]; then
            echo "Archive created successfully"
            exit 0
          else
            echo "Archive creation failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo 'SSH connection successful'"

      - name: Upload Archive to Server
        run: |
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key deployment.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/

      - name: Deploy on Server
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' << 'DEPLOY_SCRIPT'
          set -e
          APP="/home/pathpilo/htdocs/pathpilo.com"
          TEMP_DEPLOY="/tmp/pathpilo_deploy_$$"

          mkdir -p $TEMP_DEPLOY

          echo "==> Extracting deployment..."
          tar -xzf /tmp/deployment.tar.gz -C $TEMP_DEPLOY

          echo "==> Syncing files..."
          # Blog MDX + images are written live by the Grok MCP connector.
          # Exclude them from --delete so bot posts survive deploys; merge from
          # git afterward (adds/updates without wiping MCP-only files).
          rsync -a --delete \
            --exclude='.env' \
            --exclude='api-server/.env' \
            --exclude='node_modules' \
            --exclude='api-server/node_modules' \
            --exclude='marketing/node_modules' \
            --exclude='marketing/mcp-blog/node_modules' \
            --exclude='marketing/content/articles/' \
            --exclude='marketing/public/images/articles/' \
            --exclude='logs' \
            $TEMP_DEPLOY/ $APP/

          mkdir -p "$APP/marketing/content/articles" "$APP/marketing/public/images/articles"
          rsync -a "$TEMP_DEPLOY/marketing/content/articles/" "$APP/marketing/content/articles/"
          rsync -a "$TEMP_DEPLOY/marketing/public/images/articles/" "$APP/marketing/public/images/articles/"

          rm -rf $TEMP_DEPLOY
          rm -f /tmp/deployment.tar.gz

          cd $APP

          echo "==> Writing .env..."
          # Secret values come from GitHub Secrets/Variables (preferred) OR from a
          # stable secrets file at ~/pathpilo-secrets.env that is NEVER touched by
          # deploys and survives rsync. This avoids the FTP-edit-gets-wiped problem.
          # To seed it once: SSH in and create ~/pathpilo-secrets.env with KEY=VALUE lines.
          SECRETS_FILE="$HOME/pathpilo-secrets.env"

          read_env_key() {
            local file="$1" key="$2"
            [ -f "$file" ] || return 0
            grep -E "^${key}=" "$file" 2>/dev/null | tail -1 | cut -d= -f2- || true
          }

          # Priority: GitHub secret/var → stable secrets file → existing app .env
          resolve() {
            local gh_val="$1" key="$2"
            local val="$gh_val"
            if [ -z "$val" ]; then val="$(read_env_key "$SECRETS_FILE" "$key")"; fi
            if [ -z "$val" ]; then val="$(read_env_key "$APP/api-server/.env" "$key")"; fi
            if [ -z "$val" ]; then val="$(read_env_key "$APP/.env" "$key")"; fi
            if [ -n "$val" ]; then
              printf '%s' "$val"
            else
              echo "==> WARNING: ${key} is empty — add to GitHub secrets/vars or $SECRETS_FILE" >&2
            fi
          }

          DEPLOY_SECURE_NOTES_KEY="$(resolve '${{ secrets.SECURE_NOTES_MASTER_KEY }}' SECURE_NOTES_MASTER_KEY)"
          DEPLOY_CRISP="$(resolve '${{ vars.NEXT_PUBLIC_CRISP_WEBSITE_ID }}' NEXT_PUBLIC_CRISP_WEBSITE_ID)"
          DEPLOY_STRIPE_SECRET="$(resolve '${{ secrets.STRIPE_SECRET_KEY }}' STRIPE_SECRET_KEY)"
          DEPLOY_STRIPE_WEBHOOK="$(resolve '${{ secrets.STRIPE_WEBHOOK_SECRET }}' STRIPE_WEBHOOK_SECRET)"
          DEPLOY_STRIPE_MONTHLY="$(resolve '${{ vars.STRIPE_PRICE_MONTHLY }}' STRIPE_PRICE_MONTHLY)"
          DEPLOY_STRIPE_ANNUAL="$(resolve '${{ vars.STRIPE_PRICE_ANNUAL }}' STRIPE_PRICE_ANNUAL)"
          sanitize_token() {
            # trim CR/LF/spaces/quotes; drop known placeholders
            local t
            t="$(printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            t="$(printf '%s' "$t" | sed 's/^"//;s/"$//;s/^'\''//;s/'\''$//')"
            case "$t" in
              ''|replace-with-your-password|replace-with-a-long-random-secret|changeme|your-token|your-password)
                printf ''
                ;;
              *)
                printf '%s' "$t"
                ;;
            esac
          }

          # /tmp handoff from ssh-pathpilo ALWAYS wins when valid (fixes stale
          # placeholder that was previously written into pathpilo-secrets.env).
          HANDOFF_TOKEN="$(sanitize_token "$(read_env_key /tmp/pathpilo-blog-mcp-token.env BLOG_MCP_TOKEN)")"
          DEPLOY_BLOG_MCP_TOKEN="$(sanitize_token "$(resolve '${{ secrets.BLOG_MCP_TOKEN }}' BLOG_MCP_TOKEN)")"
          if [ -z "$DEPLOY_BLOG_MCP_TOKEN" ]; then
            DEPLOY_BLOG_MCP_TOKEN="$(sanitize_token "$(read_env_key "$APP/marketing/mcp-blog/.env" BLOG_MCP_TOKEN)")"
          fi
          if [ -z "$DEPLOY_BLOG_MCP_TOKEN" ]; then
            DEPLOY_BLOG_MCP_TOKEN="$(sanitize_token "$(read_env_key /home/ssh-pathpilo/pathpilo/.env BLOG_MCP_TOKEN)")"
          fi
          if [ -z "$DEPLOY_BLOG_MCP_TOKEN" ]; then
            DEPLOY_BLOG_MCP_TOKEN="$(sanitize_token "$(read_env_key /home/ssh-pathpilo/pathpilo/marketing/mcp-blog/.env BLOG_MCP_TOKEN)")"
          fi
          if [ -n "$HANDOFF_TOKEN" ]; then
            DEPLOY_BLOG_MCP_TOKEN="$HANDOFF_TOKEN"
            echo "==> BLOG_MCP_TOKEN: using /tmp handoff (${#DEPLOY_BLOG_MCP_TOKEN} chars) — overrides secrets file"
          elif [ -n "$DEPLOY_BLOG_MCP_TOKEN" ]; then
            echo "==> BLOG_MCP_TOKEN: present (${#DEPLOY_BLOG_MCP_TOKEN} chars)"
          else
            echo "==> WARNING: BLOG_MCP_TOKEN missing/placeholder — blog MCP will not start"
          fi

          # Persist resolved secrets back to the stable file so future deploys
          # can preserve them even if GitHub secrets are not yet configured.
          printf '%s\n' \
            "SECURE_NOTES_MASTER_KEY=$DEPLOY_SECURE_NOTES_KEY" \
            "NEXT_PUBLIC_CRISP_WEBSITE_ID=$DEPLOY_CRISP" \
            "STRIPE_SECRET_KEY=$DEPLOY_STRIPE_SECRET" \
            "STRIPE_WEBHOOK_SECRET=$DEPLOY_STRIPE_WEBHOOK" \
            "STRIPE_PRICE_MONTHLY=$DEPLOY_STRIPE_MONTHLY" \
            "STRIPE_PRICE_ANNUAL=$DEPLOY_STRIPE_ANNUAL" \
            "BLOG_MCP_TOKEN=$DEPLOY_BLOG_MCP_TOKEN" \
            > "$SECRETS_FILE"
          chmod 600 "$SECRETS_FILE"
          echo "==> Secrets saved to $SECRETS_FILE"

          printf '%s\n' \
            "DATABASE_URL=postgresql://${{ vars.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ vars.DB_HOST }}:${{ vars.DB_PORT }}/${{ vars.DB_NAME }}" \
            "DB_HOST=${{ vars.DB_HOST }}" \
            "DB_PORT=${{ vars.DB_PORT }}" \
            "DB_NAME=${{ vars.DB_NAME }}" \
            "DB_USER=${{ vars.DB_USER }}" \
            "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
            "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            "ADMIN_EMAIL=${{ vars.ADMIN_EMAIL }}" \
            "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" \
            "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" \
            "NEXT_PUBLIC_MAPBOX_TOKEN=${{ vars.NEXT_PUBLIC_MAPBOX_TOKEN }}" \
            "NEXT_PUBLIC_HOTJAR_ID=${{ vars.NEXT_PUBLIC_HOTJAR_ID }}" \
            "NEXT_PUBLIC_HOTJAR_SV=${{ vars.NEXT_PUBLIC_HOTJAR_SV }}" \
            "NEXT_PUBLIC_CRISP_WEBSITE_ID=$DEPLOY_CRISP" \
            "FROM_EMAIL=${{ vars.FROM_EMAIL }}" \
            "FROM_NAME=${{ vars.FROM_NAME }}" \
            "FRONTEND_URL=${{ vars.FRONTEND_URL }}" \
            "API_PORT=${{ vars.API_PORT }}" \
            "PORT=${{ vars.PORT }}" \
            "NODE_ENV=production" \
            "ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}" \
            "SECURE_NOTES_MASTER_KEY=$DEPLOY_SECURE_NOTES_KEY" \
            "STRIPE_SECRET_KEY=$DEPLOY_STRIPE_SECRET" \
            "STRIPE_WEBHOOK_SECRET=$DEPLOY_STRIPE_WEBHOOK" \
            "STRIPE_PRICE_MONTHLY=$DEPLOY_STRIPE_MONTHLY" \
            "STRIPE_PRICE_ANNUAL=$DEPLOY_STRIPE_ANNUAL" \
            "APP_URL=${{ vars.APP_URL }}" \
            "BLOG_MCP_TOKEN=$DEPLOY_BLOG_MCP_TOKEN" \
            "NEXT_PUBLIC_API_URL=" > .env

          mkdir -p marketing/mcp-blog
          printf '%s\n' \
            "BLOG_MCP_TOKEN=$DEPLOY_BLOG_MCP_TOKEN" \
            "BLOG_MCP_PORT=8787" \
            "BLOG_MCP_HOST=127.0.0.1" \
            "BLOG_MCP_ALLOWED_HOSTS=pathpilo.com,www.pathpilo.com,127.0.0.1,localhost" \
            "BLOG_MCP_MARKETING_ROOT=$APP/marketing" \
            > marketing/mcp-blog/.env
          chmod 600 marketing/mcp-blog/.env

          printf '%s\n' \
            "DB_HOST=${{ vars.DB_HOST }}" \
            "DB_PORT=${{ vars.DB_PORT }}" \
            "DB_NAME=${{ vars.DB_NAME }}" \
            "DB_USER=${{ vars.DB_USER }}" \
            "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
            "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" \
            "FROM_EMAIL=${{ vars.FROM_EMAIL }}" \
            "FRONTEND_URL=${{ vars.APP_URL }}" \
            "API_PORT=${{ vars.API_PORT }}" \
            "NODE_ENV=production" \
            "ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}" \
            "SECURE_NOTES_MASTER_KEY=$DEPLOY_SECURE_NOTES_KEY" \
            "STRIPE_SECRET_KEY=$DEPLOY_STRIPE_SECRET" \
            "STRIPE_WEBHOOK_SECRET=$DEPLOY_STRIPE_WEBHOOK" \
            "STRIPE_PRICE_MONTHLY=$DEPLOY_STRIPE_MONTHLY" \
            "STRIPE_PRICE_ANNUAL=$DEPLOY_STRIPE_ANNUAL" \
            "APP_URL=${{ vars.APP_URL }}" > api-server/.env

          echo "==> Installing production dependencies..."
          npm ci --omit=dev
          cd api-server && npm ci --omit=dev && cd ..
          cd marketing && npm ci --omit=dev && cd ..
          if [ -f marketing/mcp-blog/package.json ]; then
            cd marketing/mcp-blog && npm ci --omit=dev && cd ../..
          fi

          mkdir -p logs

          echo "==> PM2 status before restart:"
          pm2 status || true

          # Detect which localhost port Nginx expects for the marketing site.
          # Never reset frontend/api from ecosystem.config.js — that overwrites
          # live ports and causes 502s.
          detect_marketing_port() {
            local p=""
            local f
            for f in \
              /etc/nginx/sites-enabled/pathpilo.com.conf \
              /etc/nginx/sites-enabled/pathpilo.com \
              /etc/nginx/conf.d/pathpilo.com.conf \
              /home/pathpilo/conf/nginx/pathpilo.com.conf \
              /etc/nginx/sites-enabled/*; do
              [ -r "$f" ] || continue
              p="$(grep -E 'proxy_pass[[:space:]]+http://127\.0\.0\.1:[0-9]+' "$f" 2>/dev/null \
                | grep -v blog-mcp \
                | head -1 \
                | grep -oE '127\.0\.0\.1:[0-9]+' \
                | cut -d: -f2 || true)"
              if [ -n "$p" ]; then echo "$p"; return 0; fi
            done
            # Historical live port for pathpilo.com on this host
            echo "3006"
          }

          MARKETING_PORT="$(detect_marketing_port)"
          echo "==> Marketing upstream port: $MARKETING_PORT"

          # If a previous standalone copy exists, keep its public/ in sync with
          # live MCP uploads (belt-and-suspenders alongside the blog-media route).
          if [ -d "$APP/marketing/.next/standalone" ]; then
            mkdir -p "$APP/marketing/.next/standalone/public/images/articles"
            rsync -a "$APP/marketing/public/" "$APP/marketing/.next/standalone/public/" || true
          fi

          echo "==> Restoring pathpilo-marketing on port $MARKETING_PORT..."
          pm2 delete pathpilo-marketing 2>/dev/null || true
          PORT="$MARKETING_PORT" pm2 start npm --name pathpilo-marketing \
            --cwd "$APP/marketing" \
            -- start -- -p "$MARKETING_PORT"

          echo "==> Soft-restart app + API (keep existing PM2 env/ports)..."
          pm2 restart pathpilo-frontend 2>/dev/null || true
          pm2 restart pathpilo-api 2>/dev/null || true

          echo "==> Ensure blog MCP runs from htdocs tree only..."
          pm2 delete pathpilo-blog-mcp 2>/dev/null || true
          # Free port 8787 if a stale process (often ssh-pathpilo's PM2) still holds it
          if command -v fuser >/dev/null 2>&1; then
            fuser -k 8787/tcp 2>/dev/null || true
          fi
          sleep 1
          pm2 start ecosystem.config.js --only pathpilo-blog-mcp

          # Best-effort: copy bot-written articles from the ssh-pathpilo clone if readable
          SSH_ARTICLES="/home/ssh-pathpilo/pathpilo/marketing/content/articles"
          SSH_IMAGES="/home/ssh-pathpilo/pathpilo/marketing/public/images/articles"
          if [ -r "$SSH_ARTICLES" ]; then
            echo "==> Syncing articles from ssh-pathpilo clone into live htdocs..."
            rsync -a "$SSH_ARTICLES/" "$APP/marketing/content/articles/" || true
          else
            echo "==> Cannot read $SSH_ARTICLES (expected if permissions block it)."
            echo "    Stop MCP under ssh-pathpilo, then re-publish via the connector."
          fi
          if [ -r "$SSH_IMAGES" ]; then
            rsync -a "$SSH_IMAGES/" "$APP/marketing/public/images/articles/" || true
          fi

          pm2 save
          pm2 status || true

          echo "==> Local smoke checks..."
          sleep 3
          curl -sS -o /dev/null -w "marketing_local:%{http_code}\n" "http://127.0.0.1:${MARKETING_PORT}/" || true
          echo "==> Blog MCP health (must show writingToLiveTree:true):"
          HEALTH_JSON="$(curl -sS "http://127.0.0.1:8787/health" || true)"
          echo "$HEALTH_JSON"
          echo ""
          if ! echo "$HEALTH_JSON" | grep -q '"ok":true'; then
            echo "==> Blog MCP failed — last logs:"
            pm2 logs pathpilo-blog-mcp --lines 40 --nostream || true
          fi
          echo "==> Live article count in htdocs:"
          ls -1 "$APP/marketing/content/articles"/*.mdx 2>/dev/null | wc -l || true

          echo "==> Deploy complete!"
          DEPLOY_SCRIPT

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          rm -f deployment.tar.gz
